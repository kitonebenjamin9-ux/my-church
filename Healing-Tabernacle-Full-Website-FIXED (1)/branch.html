<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch | Healing Tabernacle Ministries</title><link rel="icon" href="assets/logo/favicon.png"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/htm-platform.css"></head><body><a class="skip-link" href="#main-content">Skip to main content</a><div id="site-header"></div><section class="page-hero"><div class="container"><span class="eyebrow">Our Family</span><h1 id="branchName">Branch</h1><p id="branchLocation"></p></div></section><section class="section"><div class="container"><div id="branchDetails" class="htm-grid"></div><div style="margin-top:25px"><div data-htm-rotating-gallery></div></div></div></section><div id="site-footer"></div><script src="js/config.js"></script><script src="js/main.js"></script><script type="module">
import {db} from "./js/firebase.js";import{doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const id=new URLSearchParams(location.search).get("id");(async()=>{if(!id)return;try{const s=await getDoc(doc(db,"branches",id));if(!s.exists())return;const x=s.data();branchName.textContent=x.name||"Branch";branchLocation.textContent=x.location||x.address||"";branchDetails.innerHTML=`<div class="htm-card"><div class="htm-card-body"><h2>${x.pastor?"Pastor "+x.pastor:"Branch Pastor"}</h2><p>${x.description||""}</p><p><strong>Services:</strong> ${x.serviceTimes||""}</p><p>${x.address||""}</p><div class="htm-actions">${x.whatsapp?`<a class="htm-btn" href="https://wa.me/${String(x.whatsapp).replace(/\\D/g,"")}">WhatsApp</a>`:""}${x.phone?`<a class="htm-btn ghost" href="tel:${x.phone}">Call</a>`:""}</div></div></div>`}catch(e){console.error(e)}})();</script><script type="module" src="js/htm-platform.js"></script></body></html>
