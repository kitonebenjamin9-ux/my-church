<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Healing Tabernacle Church</title>
<link rel="icon" href="assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body><a class="skip-link" href="#main-content">Skip to main content</a>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">Join Us</span>
    <h1>Create Account</h1>
    <p>Register to submit prayer requests and stay connected with our prayer team.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:460px;">
    <div class="card">
      <div class="card-body" style="padding:36px 32px;">

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Full Name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" required autocomplete="new-password" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Account</button>
        </form>

        <p id="message" class="form-note" style="text-align:center;margin-top:18px;"></p>

        <p class="form-note" style="text-align:center;margin-top:18px;">
          Already have an account? <a href="login.html">Login</a>
        </p>

      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/register.js"></script>

<script type="module" src="js/htm-platform.js"></script>
</body>
</html>
