<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Library | Healing Tabernacle</title><link rel="icon" href="assets/logo/favicon.png"><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1050px;margin:auto;padding:45px 20px}.card{background:#fff;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 10px 30px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.drop{border:2px dashed #4b0082;border-radius:16px;padding:25px}.drop input{width:100%;margin:12px 0}.msg{padding:12px;border-radius:10px;margin:12px 0}.ok{background:#e8f7ee;color:#176b38}.err{background:#fdeaea;color:#a22}.media-row{border:1px solid #eee;border-radius:12px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.media-row a{word-break:break-all}@media(max-width:700px){.grid{grid-template-columns:1fr}.media-row{display:block}}</style></head><body><div id="site-header"></div><section class="page-hero"><div class="container"><span class="eyebrow">Administrator</span><h1>Media Library</h1><p>Upload audio and PDF resources to Firebase Storage.</p></div></section><main class="wrap"><div id="auth"></div><div class="card"><h2>Upload Media</h2><p>Choose an audio file or PDF. It will be stored in Firebase Storage and registered in Firestore.</p><div class="grid"><div class="drop"><h3>🎧 Audio</h3><input id="audio" type="file" accept="audio/*"><button class="btn btn-primary" id="uploadAudio">Upload Audio</button></div><div class="drop"><h3>📄 PDF</h3><input id="pdf" type="file" accept="application/pdf"><button class="btn btn-primary" id="uploadPdf">Upload PDF</button></div></div><div id="msg"></div></div><div class="card"><h2>Published Media</h2><div id="list">Loading…</div></div></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/main.js"></script><script type="module">
import {auth,db,app} from './js/firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import {collection,getDocs,query,orderBy,doc,getDoc,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
import {getStorage,ref,uploadBytes,getDownloadURL} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js';
const storage=getStorage(app), $=id=>document.getElementById(id), esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML};
let allowed=false;
function msg(t,ok=true){$('msg').innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`}
async function load(){try{const s=await getDocs(query(collection(db,'mediaLibrary'),orderBy('createdAt','desc')));$('list').innerHTML=s.empty?'<p>No media uploaded yet.</p>':s.docs.map(d=>{const x=d.data();return `<div class="media-row"><div><strong>${esc(x.title||x.fileName)}</strong><br><small>${esc(x.type||'')} · ${esc(x.path||'')}</small></div><a href="${esc(x.url)}" target="_blank" rel="noopener">Open file</a></div>`}).join('')}catch(e){$('list').textContent='Media list unavailable.';console.warn(e)}}
async function upload(inputId,type){if(!allowed)return msg('Administrator access required.',false);const f=$(inputId).files[0];if(!f)return msg('Choose a file first.',false);if(type==='pdf'&&f.type!=='application/pdf')return msg('Please choose a PDF file.',false);if(type==='audio'&&!f.type.startsWith('audio/'))return msg('Please choose an audio file.',false);if(f.size>100*1024*1024)return msg('File is larger than 100 MB.',false);try{msg('Uploading…');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'-');const path=`media/${type}/${Date.now()}-${safe}`;const r=ref(storage,path);await uploadBytes(r,f,{contentType:f.type});const url=await getDownloadURL(r);await addDoc(collection(db,'mediaLibrary'),{title:f.name,fileName:f.name,type,path,url,size:f.size,contentType:f.type,createdAt:serverTimestamp()});msg('Uploaded successfully.');$(inputId).value='';load()}catch(e){console.error(e);msg('Upload failed. Check Firebase Storage rules and your administrator account.',false)}}
$('uploadAudio').onclick=()=>upload('audio','audio');$('uploadPdf').onclick=()=>upload('pdf','pdf');
onAuthStateChanged(auth,async u=>{if(!u){$('auth').innerHTML='<div class="msg err">Please sign in through Admin Login first.</div>';return}const p=await getDoc(doc(db,'users',u.uid));const role=String(p.data()?.role||'').trim().toLowerCase();allowed=['admin','pastor'].includes(role);$('auth').innerHTML=`<div class="msg ${allowed?'ok':'err'}">${allowed?'Signed in as '+esc(u.email):'Administrator or pastor access required.'}</div>`;if(allowed)load()});
</script></body></html>
