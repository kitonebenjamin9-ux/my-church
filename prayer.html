<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Request - Healing Tabernacle Church</title>
<link rel="icon" href="assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body><a class="skip-link" href="#main-content">Skip to main content</a>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">We're Praying With You</span>
    <h1>Prayer Request</h1>
    <p id="userInfo"></p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:560px;">

    <div class="card" style="margin-bottom:32px;">
      <div class="card-body" style="padding:36px 32px;">

        <form id="prayerForm" novalidate>
          <div class="form-group">
            <label for="category">Prayer Category</label>
            <select id="category">
              <option value="Healing">Healing</option>
              <option value="Family">Family</option>
              <option value="Finances">Finances</option>
              <option value="Guidance">Guidance</option>
              <option value="Salvation">Salvation</option>
              <option value="Thanksgiving">Thanksgiving</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="request">Your Prayer Request</label>
            <textarea id="request" rows="8" placeholder="Write your prayer request..." required></textarea>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
              <input type="checkbox" id="isPrivate"> Keep this request private (visible only to pastoral staff)
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px;">
              <input type="checkbox" id="wantsPrayerPartner"> I'd like someone from our prayer team to pray with me directly
            </label>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Send Prayer Request</button>
        </form>

        <p id="message" class="form-note" style="text-align:center;margin-top:18px;"></p>

        <p class="form-note" style="text-align:center;margin-top:18px;">
          <a href="#" id="logout">Logout</a>
        </p>
      </div>
    </div>

    <h2>My Prayer Requests</h2>
    <div id="myRequests"></div>

  </div>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/prayer.js"></script>

<script type="module" src="js/htm-platform.js"></script>
</body>
</html>
