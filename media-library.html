<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Library | Healing Tabernacle</title><link rel="icon" href="assets/logo/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div><section class="page-hero"><div class="container"><span class="eyebrow">Resources</span><h1>Audio & PDFs</h1><p>Listen, read and grow with church resources.</p></div></section><main id="main-content"><section class="section"><div class="container"><div id="media" class="htm-grid"><div class="htm-empty">Loading resources…</div></div></div></section></main><div id="site-footer"></div><script src="js/config.js"></script><script src="js/main.js"></script><script type="module">import {db} from './js/firebase.js';import{collection,getDocs,query,orderBy}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const e=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML};(async()=>{const m=document.getElementById('media');try{const s=await getDocs(query(collection(db,'mediaLibrary'),orderBy('createdAt','desc')));if(s.empty){m.innerHTML='<div class="htm-empty">No resources published yet.</div>';return}m.innerHTML=s.docs.map(d=>{const x=d.data();return `<article class="htm-card"><div class="htm-card-body"><span class="htm-pill">${e(x.type||'resource')}</span><h3>${e(x.title||x.fileName)}</h3><p>${e(x.description||'Church resource')}</p><div class="htm-actions"><a class="htm-btn" href="${e(x.url)}" target="_blank" rel="noopener">Open</a>${x.type==='audio'?`<audio controls preload="none" src="${e(x.url)}" style="width:100%;margin-top:10px"></audio>`:''}</div></div></article>`}).join('')}catch(err){console.error(err);m.innerHTML='<div class="htm-empty">Resources are temporarily unavailable.</div>'}})();</script></body></html>
